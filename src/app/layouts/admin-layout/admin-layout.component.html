<div class="min-h-screen bg-slate-50">

  <!-- Header -->
  <app-header
    role="Admin"
    (menuToggle)="toggleSidebar()">
  </app-header>


  <!-- Body -->
  <div class="flex">


    <!-- Sidebar -->
    <app-admin-sidebar
      *ngIf="sidebarOpen">
    </app-admin-sidebar>


    <!-- Main Content -->
    <main
      class="min-h-[calc(100vh-4rem)] flex-1 overflow-auto p-4 transition-all duration-300 md:p-6">

      <router-outlet></router-outlet>

    </main>


  </div>

</div>
