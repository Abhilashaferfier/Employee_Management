<div class="min-h-screen bg-slate-50">

  <!-- Header -->
  <app-header
    role="Employee"
    (menuToggle)="toggleSidebar()">
  </app-header>


  <!-- Body -->
  <div class="flex">

    <!-- Sidebar -->
    <app-employee-sidebar
      *ngIf="sidebarOpen">
    </app-employee-sidebar>


    <!-- Dashboard / Page Content -->
    <main
      class="min-h-[calc(100vh-4rem)] flex-1 overflow-auto p-4 md:p-6">

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
