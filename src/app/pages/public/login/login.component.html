<div class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-8">

  <div class="w-full max-w-md">

    <!-- Portal Heading -->

    <div class="text-center mb-6">

      <h1 class="text-2xl md:text-3xl font-bold text-slate-800">
        Employee Management Portal
      </h1>

      

    </div>


    <!-- Login Card -->

    <div
      class="bg-white border border-slate-200 rounded-xl shadow-sm p-6 md:p-8"
    >

      <!-- Header -->

      <div class="text-center mb-7">

        <h2 class="text-2xl font-semibold text-slate-800">
          Welcome Back!
        </h2>

        <p class="text-sm text-slate-500 mt-1">
          Sign in to continue
        </p>

      </div>


      <!-- API Error -->

      <div
        *ngIf="loginError"
        class="mb-5 p-3 rounded-lg bg-red-50 border border-red-200 text-red-600 text-sm"
      >
        {{ loginError }}
      </div>


      <!-- Login Form -->

      <form
        [formGroup]="loginForm"
        (ngSubmit)="onLogin()"
      >

        <!-- Email -->

        <div class="mb-5">

          <label
            for="email"
            class="block text-sm font-medium text-slate-700 mb-2"
          >
            Email Address
          </label>

          <input
            id="email"
            type="email"
            pInputText
            formControlName="email"
            placeholder="Enter email"
            class="w-full !border !border-slate-300 !rounded-lg px-3 py-2
                   focus:!border-blue-400 focus:!ring-1 focus:!ring-blue-200"
          />

          <small
            *ngIf="submitted && email?.hasError('required')"
            class="block text-red-500 mt-1"
          >
            Email is required.
          </small>

          <small
            *ngIf="submitted && email?.hasError('email')"
            class="block text-red-500 mt-1"
          >
            Please enter a valid email.
          </small>

        </div>


        <!-- Password -->

        <div class="mb-4">

          <label
            for="password"
            class="block text-sm font-medium text-slate-700 mb-2"
          >
            Password
          </label>

          <p-password
            formControlName="password"
            placeholder="Enter password"
            [toggleMask]="true"
            [feedback]="false"
            styleClass="w-full"
            inputStyleClass="w-full !border !border-slate-300 !rounded-lg px-3 py-2
                             focus:!border-blue-400 focus:!ring-1 focus:!ring-blue-200"
          >
          </p-password>

          <small
            *ngIf="submitted && password?.hasError('required')"
            class="block text-red-500 mt-1"
          >
            Password is required.
          </small>

          <small
            *ngIf="submitted && password?.hasError('minlength')"
            class="block text-red-500 mt-1"
          >
            Password must be at least 6 characters.
          </small>

        </div>


        <!-- Remember + Forgot -->

        <div class="flex items-center justify-between mb-6">

          <label
            class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer"
          >

            <input
              type="checkbox"
              class="w-4 h-4 rounded border-slate-300"
            />

            Remember me

          </label>

          <button
            type="button"
            class="text-sm text-blue-600 hover:text-blue-700
                   hover:underline underline-offset-2 font-medium"
          >
            Forgot Password?
          </button>

        </div>


        <!-- Login Button -->

        

         <div class="flex justify-center mt-5">

  <p-button
    type="submit"
    label="Login"
    [loading]="loading"
    styleClass="!bg-blue-400 !border-blue-400 !text-white
                px-8 py-2.5 rounded-lg font-semibold shadow-sm
                hover:!bg-blue-500 hover:!border-blue-500
                transition-all duration-200">
  </p-button>

</div>

       

      </form>


      <!-- Signup -->

      <div class="text-center mt-6">

        <span class="text-sm text-slate-600">
          Don't have an account?
        </span>

        <button
          type="button"
          (click)="goToSignup()"
          class="ml-1 text-sm font-semibold text-blue-600
                 hover:text-blue-700 hover:underline underline-offset-2"
        >
          Sign Up
        </button>

      </div>

    </div>

  </div>

</div>
