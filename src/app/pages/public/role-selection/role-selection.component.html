<div class="min-h-screen bg-slate-50">

  <!-- ================================================= -->
  <!-- COMMON HEADER -->
  <!-- ================================================= -->

  <app-header></app-header>


  <!-- ================================================= -->
  <!-- ROLE SELECTION CONTENT -->
  <!-- ================================================= -->

  <div class="flex min-h-[calc(100vh-4rem)] items-center justify-center px-4">

    <div class="w-full max-w-4xl">

      <!-- HEADING -->

      <div class="mb-10 text-center">

        <h1 class="text-3xl font-bold text-slate-800">
          Welcome Back
        </h1>

        <p class="mt-2 text-slate-500">
          Select the portal you want to access
        </p>

        <p
          *ngIf="email"
          class="mt-2 text-sm text-slate-400"
        >
          {{ email }}
        </p>

      </div>


      <!-- ================================================= -->
      <!-- CARDS -->
      <!-- ================================================= -->

      <div
        class="grid grid-cols-1 gap-6 md:grid-cols-2"
      >

        <!-- ================================================= -->
        <!-- ADMIN CARD -->
        <!-- ================================================= -->

        <div
          *ngIf="isAdmin"
          (click)="selectRole('ADMIN')"
          class="cursor-pointer rounded-2xl border border-slate-200 bg-white p-8 shadow-sm transition duration-200 hover:border-blue-400 hover:shadow-xl"
        >

          <div
            class="mb-5 flex h-14 w-14 items-center justify-center rounded-xl bg-blue-100"
          >

            <span class="text-2xl">
              🛡️
            </span>

          </div>


          <h2 class="text-xl font-bold text-slate-800">
            Admin
          </h2>


          <p class="mt-2 text-sm leading-6 text-slate-500">
            Manage users, employees, attendance,
            leave, payroll and reports.
          </p>


          <div class="mt-6 font-semibold text-blue-600">
            Enter Admin Portal →
          </div>

        </div>


        <!-- ================================================= -->
        <!-- EMPLOYEE CARD -->
        <!-- ================================================= -->

        <div
          *ngIf="isEmployee"
          (click)="selectRole('EMPLOYEE')"
          class="cursor-pointer rounded-2xl border border-slate-200 bg-white p-8 shadow-sm transition duration-200 hover:border-blue-400 hover:shadow-xl"
        >

          <div
            class="mb-5 flex h-14 w-14 items-center justify-center rounded-xl bg-slate-100"
          >

            <span class="text-2xl">
              👤
            </span>

          </div>


          <h2 class="text-xl font-bold text-slate-800">
            Employee
          </h2>


          <p class="mt-2 text-sm leading-6 text-slate-500">
            View profile, attendance, leave requests,
            payslips and reports.
          </p>


          <div class="mt-6 font-semibold text-blue-600">
            Enter Employee Portal →
          </div>

        </div>

      </div>

    </div>

  </div>

</div>
