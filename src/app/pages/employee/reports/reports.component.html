<div class="min-h-full bg-slate-50">

  <!-- Header -->

  <div class="mb-6">

    <h2 class="text-2xl font-bold text-slate-800">
      My Reports
    </h2>

    <p class="mt-1 text-sm text-slate-500">
      View and download your employee reports.
    </p>

  </div>


  <!-- Available Reports -->

  <div class="mb-6">

    <h3 class="mb-4 text-lg font-semibold text-slate-800">
      Available Reports
    </h3>


    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">


      <div
        *ngFor="let report of reports"
        class="rounded-xl border border-blue-100 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">


        <!-- Icon -->

        <div
          class="flex h-11 w-11 items-center justify-center rounded-lg bg-blue-50">

          <i
            [class]="report.icon + ' text-lg text-blue-600'">
          </i>

        </div>


        <!-- Content -->

        <h4 class="mt-4 text-sm font-semibold text-slate-800">
          {{ report.title }}
        </h4>

        <p class="mt-1 text-xs text-slate-500">
          {{ report.description }}
        </p>


        <!-- Download -->

        <button
          type="button"
          (click)="downloadReport(report.title)"
          class="mt-4 text-xs font-medium text-blue-600 hover:text-blue-700">

          <i class="pi pi-download mr-1"></i>

          Download

        </button>

      </div>

    </div>

  </div>


  <!-- Recent Downloads -->

  <div
    class="overflow-hidden rounded-xl border border-blue-100 bg-white shadow-sm">

    <div class="border-b border-slate-100 px-5 py-4">

      <h3 class="font-semibold text-slate-800">
        Recent Downloads
      </h3>

    </div>


    <div class="overflow-x-auto">

      <table class="w-full text-left text-sm">

        <thead class="bg-blue-50 text-xs uppercase text-slate-500">

          <tr>

            <th class="px-5 py-3">
              Report Name
            </th>

            <th class="px-5 py-3">
              Downloaded On
            </th>

            <th class="px-5 py-3 text-center">
              Action
            </th>

          </tr>

        </thead>


        <tbody class="divide-y divide-slate-100">

          <tr
            *ngFor="let download of recentDownloads"
            class="hover:bg-blue-50/50">

            <td class="px-5 py-4 font-medium text-slate-700">
              {{ download.reportName }}
            </td>

            <td class="px-5 py-4 text-slate-500">
              {{ download.downloadedOn }}
            </td>

            <td class="px-5 py-4 text-center">

              <button
                type="button"
                (click)="downloadReport(download.reportName)"
                class="rounded-lg p-2 text-blue-600 transition hover:bg-blue-50">

                <i class="pi pi-download"></i>

              </button>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
