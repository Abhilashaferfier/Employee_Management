<div class="min-h-full bg-slate-50">

  <!-- Header -->

  <div class="mb-6 flex flex-col justify-between gap-3 sm:flex-row sm:items-center">

    <div>

      <h2 class="text-2xl font-bold text-slate-800">
        My Leave Requests
      </h2>

      <p class="mt-1 text-sm text-slate-500">
        View and manage your leave requests.
      </p>

    </div>


    <button
      type="button"
      (click)="applyLeave()"
      class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-blue-700">

      <i class="pi pi-plus mr-2"></i>

      Apply Leave

    </button>

  </div>


  <!-- Table -->

  <div class="overflow-hidden rounded-xl border border-blue-100 bg-white shadow-sm">

    <div class="overflow-x-auto">

      <table class="w-full text-left text-sm">

        <thead class="bg-blue-50 text-xs uppercase text-slate-500">

          <tr>

            <th class="px-5 py-3">
              Leave Type
            </th>

            <th class="px-5 py-3">
              From
            </th>

            <th class="px-5 py-3">
              To
            </th>

            <th class="px-5 py-3">
              Status
            </th>

          </tr>

        </thead>


        <tbody class="divide-y divide-slate-100">

          <tr
            *ngFor="let leave of leaveRequests"
            class="hover:bg-blue-50/50">

            <td class="px-5 py-4 font-medium text-slate-700">
              {{ leave.leaveType }}
            </td>

            <td class="px-5 py-4 text-slate-500">
              {{ leave.from }}
            </td>

            <td class="px-5 py-4 text-slate-500">
              {{ leave.to }}
            </td>

            <td class="px-5 py-4">

              <span
                *ngIf="leave.status === 'Pending'"
                class="rounded-full bg-blue-50 px-3 py-1 text-xs font-medium text-blue-600">

                Pending

              </span>


              <span
                *ngIf="leave.status === 'Approved'"
                class="rounded-full bg-green-50 px-3 py-1 text-xs font-medium text-green-600">

                Approved

              </span>


              <span
                *ngIf="leave.status === 'Rejected'"
                class="rounded-full bg-red-50 px-3 py-1 text-xs font-medium text-red-600">

                Rejected

              </span>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
