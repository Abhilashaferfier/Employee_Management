<div class="min-h-screen bg-slate-50 p-6">

  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <div class="flex items-center justify-between mb-6">

    <div>

      <h1 class="text-2xl font-bold text-slate-800">
        Role Management
      </h1>

      <p class="mt-1 text-sm text-slate-500">
        View employee and admin access
      </p>

    </div>


    <!-- TOTAL USERS -->

    <div
      class="rounded-xl border border-slate-200 bg-white px-5 py-3"
    >

      <p class="text-xs text-slate-500">
        Total Users
      </p>

      <p class="text-xl font-bold text-slate-800">
        {{ users.length }}
      </p>

    </div>

  </div>


  <!-- ================================================= -->
  <!-- ERROR -->
  <!-- ================================================= -->

  <div
    *ngIf="errorMessage"
    class="mb-4 rounded-lg border border-red-200 bg-red-50 p-3 text-red-700"
  >

    {{ errorMessage }}

  </div>


  <!-- ================================================= -->
  <!-- LOADING -->
  <!-- ================================================= -->

  <div
    *ngIf="loading"
    class="rounded-xl border border-slate-200 bg-white p-10 text-center"
  >

    <p class="text-slate-500">
      Loading users...
    </p>

  </div>


  <!-- ================================================= -->
  <!-- USERS TABLE -->
  <!-- ================================================= -->

  <div
    *ngIf="!loading"
    class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"
  >

    <div class="overflow-x-auto">

      <table class="w-full table-fixed">

        <!-- ============================================= -->
        <!-- HEADER -->
        <!-- ============================================= -->

        <thead
          class="border-b border-slate-200 bg-slate-50"
        >

          <tr>


            <!-- EMAIL -->

            <th
              class="w-1/3 px-6 py-4 text-left text-sm font-semibold text-slate-600"
            >

              Email

            </th>


            <!-- ADMIN -->

            <th
              class="w-1/3 px-6 py-4 text-center text-sm font-semibold text-slate-600"
            >

              Admin

            </th>


            <!-- EMPLOYEE -->

            <th
              class="w-1/3 px-6 py-4 text-center text-sm font-semibold text-slate-600"
            >

              Employee

            </th>


          </tr>

        </thead>


        <!-- ============================================= -->
        <!-- BODY -->
        <!-- ============================================= -->

        <tbody>


          <!-- =========================================== -->
          <!-- NO DATA -->
          <!-- =========================================== -->

          <tr
            *ngIf="users.length === 0"
          >

            <td
              colspan="3"
              class="px-6 py-12 text-center text-slate-500"
            >

              No users found.

            </td>

          </tr>


          <!-- =========================================== -->
          <!-- USERS -->
          <!-- =========================================== -->

          <tr
            *ngFor="let user of users"
            class="border-b border-slate-100 hover:bg-slate-50"
          >


            <!-- ========================================= -->
            <!-- EMAIL -->
            <!-- ========================================= -->

            <td
              class="w-1/3 px-6 py-5"
            >

              <span
                class="block break-all text-sm font-medium text-slate-800"
              >

                {{ user.email }}

              </span>

            </td>


            <!-- ========================================= -->
            <!-- ADMIN -->
            <!-- ========================================= -->

            <td
              class="w-1/3 px-6 py-5 text-center"
            >

              <div
                class="flex items-center justify-center gap-3"
              >

                <input
                  type="checkbox"
                  [checked]="user.isAdmin"
                  disabled
                  class="h-4 w-4 cursor-not-allowed"
                >

                <span
                  class="text-sm font-medium text-slate-700"
                >

                  Admin

                </span>

              </div>

            </td>


            <!-- ========================================= -->
            <!-- EMPLOYEE -->
            <!-- ========================================= -->

            <td
              class="w-1/3 px-6 py-5 text-center"
            >

              <div
                class="flex items-center justify-center gap-3"
              >

                <input
                  type="checkbox"
                  [checked]="user.isEmployee"
                  disabled
                  class="h-4 w-4 cursor-not-allowed"
                >

                <span
                  class="text-sm font-medium text-slate-700"
                >

                  Employee

                </span>

              </div>

            </td>


          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
