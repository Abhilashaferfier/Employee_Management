<div class="min-h-screen bg-slate-100 p-6">

  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <div
    class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6"
  >

    <div>

      <h1
        class="text-2xl font-bold text-slate-800"
      >
        Users
      </h1>

      <p
        class="text-sm text-slate-500 mt-1"
      >
        View all system users
      </p>

    </div>

  </div>


  <!-- ================================================= -->
  <!-- ERROR MESSAGE -->
  <!-- ================================================= -->

  <div
    *ngIf="errorMessage"
    class="mb-5 p-4 rounded-lg bg-red-50 border border-red-200 text-red-700"
  >
    {{ errorMessage }}
  </div>


  <!-- ================================================= -->
  <!-- USERS CARD -->
  <!-- ================================================= -->

  <div
    class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"
  >


    <!-- ================================================= -->
    <!-- CARD HEADER -->
    <!-- ================================================= -->

    <div
      class="px-6 py-4 border-b border-slate-200"
    >

      <div>

        <h2
          class="text-lg font-semibold text-slate-800"
        >
          All Users
        </h2>

        <p
          class="text-sm text-slate-500 mt-1"
        >
          Total users:
          {{ users.length }}
        </p>

      </div>

    </div>


    <!-- ================================================= -->
    <!-- LOADING -->
    <!-- ================================================= -->

    <div
      *ngIf="loading"
      class="p-10 text-center text-slate-500"
    >

      Loading users...

    </div>


    <!-- ================================================= -->
    <!-- TABLE -->
    <!-- ================================================= -->

    <div
      *ngIf="!loading"
      class="overflow-x-auto"
    >

      <table
        class="w-full table-fixed text-left"
      >


        <!-- ============================================= -->
        <!-- TABLE HEADER -->
        <!-- ============================================= -->

        <thead
          class="bg-slate-50 border-b border-slate-200"
        >

          <tr>

            <!-- FIRST NAME -->

            <th
              class="w-1/3 px-6 py-4 text-sm font-semibold text-slate-600"
            >
              First Name
            </th>


            <!-- LAST NAME -->

            <th
              class="w-1/3 px-6 py-4 text-sm font-semibold text-slate-600"
            >
              Last Name
            </th>


            <!-- EMAIL -->

            <th
              class="w-1/3 px-6 py-4 text-sm font-semibold text-slate-600"
            >
              Email
            </th>

          </tr>

        </thead>


        <!-- ============================================= -->
        <!-- TABLE BODY -->
        <!-- ============================================= -->

        <tbody
          class="divide-y divide-slate-200"
        >

          <tr
            *ngFor="let user of users"
            class="hover:bg-slate-50"
          >


            <!-- FIRST NAME -->

            <td
              class="w-1/3 px-6 py-4 text-sm text-slate-800"
            >
              {{ user.firstName }}
            </td>


            <!-- LAST NAME -->

            <td
              class="w-1/3 px-6 py-4 text-sm text-slate-800"
            >
              {{ user.lastName }}
            </td>


            <!-- EMAIL -->

            <td
              class="w-1/3 px-6 py-4 text-sm text-slate-600 break-words"
            >
              {{ user.email }}
            </td>

          </tr>


          <!-- ============================================= -->
          <!-- NO USERS -->
          <!-- ============================================= -->

          <tr
            *ngIf="users.length === 0"
          >

            <td
              colspan="3"
              class="px-6 py-10 text-center text-slate-500"
            >

              No users found.

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
