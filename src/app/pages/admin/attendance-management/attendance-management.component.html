<div class="min-h-full bg-slate-50">

  <div class="mb-6 flex flex-col justify-between gap-3 sm:flex-row sm:items-center">

    <div>

      <h2 class="text-2xl font-bold text-slate-800">
        Attendance Management
      </h2>

      <p class="mt-1 text-sm text-slate-500">
        Monitor employee attendance.
      </p>

    </div>

    <select
      class="rounded-lg border border-blue-200 bg-white px-4 py-2 text-sm text-slate-700 outline-none">

      <option>21 May 2025</option>
      <option>20 May 2025</option>
      <option>19 May 2025</option>

    </select>

  </div>


  <!-- Summary -->

  <div class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-3">

    <div class="rounded-xl border border-blue-100 bg-white p-5 shadow-sm">

      <p class="text-sm text-slate-500">
        Present
      </p>

      <p class="mt-2 text-3xl font-bold text-blue-600">
        {{ summary.present }}
      </p>

    </div>


    <div class="rounded-xl border border-blue-100 bg-white p-5 shadow-sm">

      <p class="text-sm text-slate-500">
        Absent
      </p>

      <p class="mt-2 text-3xl font-bold text-red-500">
        {{ summary.absent }}
      </p>

    </div>


    <div class="rounded-xl border border-blue-100 bg-white p-5 shadow-sm">

      <p class="text-sm text-slate-500">
        Late
      </p>

      <p class="mt-2 text-3xl font-bold text-orange-500">
        {{ summary.late }}
      </p>

    </div>

  </div>


  <!-- Table -->

  <div class="overflow-hidden rounded-xl border border-blue-100 bg-white shadow-sm">

    <div class="overflow-x-auto">

      <table class="w-full text-left text-sm">

        <thead class="bg-blue-50 text-xs uppercase text-slate-500">

          <tr>

            <th class="px-5 py-3">Employee</th>
            <th class="px-5 py-3">Check In</th>
            <th class="px-5 py-3">Check Out</th>
            <th class="px-5 py-3">Status</th>

          </tr>

        </thead>

        <tbody class="divide-y divide-slate-100">

          <tr
            *ngFor="let record of records"
            class="hover:bg-blue-50/50">

            <td class="px-5 py-4 font-medium text-slate-700">
              {{ record.employee }}
            </td>

            <td class="px-5 py-4 text-slate-500">
              {{ record.checkIn }}
            </td>

            <td class="px-5 py-4 text-slate-500">
              {{ record.checkOut }}
            </td>

            <td class="px-5 py-4">

              <span
                *ngIf="record.status === 'Present'"
                class="rounded-full bg-blue-50 px-3 py-1 text-xs font-medium text-blue-600">

                Present

              </span>

              <span
                *ngIf="record.status === 'Late'"
                class="rounded-full bg-orange-50 px-3 py-1 text-xs font-medium text-orange-600">

                Late

              </span>

              <span
                *ngIf="record.status === 'Absent'"
                class="rounded-full bg-red-50 px-3 py-1 text-xs font-medium text-red-500">

                Absent

              </span>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
