<div class="min-h-full bg-slate-50">

  <div class="mb-6">

    <h2 class="text-2xl font-bold text-slate-800">
      Leave Approval
    </h2>

    <p class="mt-1 text-sm text-slate-500">
      Review and approve employee leave requests.
    </p>

  </div>


  <div class="overflow-hidden rounded-xl border border-blue-100 bg-white shadow-sm">

    <div class="border-b border-slate-100 px-5 py-4">

      <span class="rounded-full bg-orange-50 px-3 py-1 text-xs font-medium text-orange-600">

        Pending {{ leaveRequests.length }}

      </span>

    </div>


    <div class="overflow-x-auto">

      <table class="w-full text-left text-sm">

        <thead class="bg-blue-50 text-xs uppercase text-slate-500">

          <tr>

            <th class="px-4 py-3">Employee</th>
            <th class="px-4 py-3">Leave Type</th>
            <th class="px-4 py-3">From</th>
            <th class="px-4 py-3">To</th>
            <th class="px-4 py-3">Reason</th>
            <th class="px-4 py-3">Action</th>

          </tr>

        </thead>

        <tbody class="divide-y divide-slate-100">

          <tr
            *ngFor="let request of leaveRequests"
            class="hover:bg-blue-50/50">

            <td class="px-4 py-4 font-medium text-slate-700">
              {{ request.employee }}
            </td>

            <td class="px-4 py-4 text-slate-500">
              {{ request.leaveType }}
            </td>

            <td class="px-4 py-4 text-slate-500">
              {{ request.from }}
            </td>

            <td class="px-4 py-4 text-slate-500">
              {{ request.to }}
            </td>

            <td class="px-4 py-4 text-slate-500">
              {{ request.reason }}
            </td>

            <td class="px-4 py-4">

              <ng-container *ngIf="request.status === 'Pending'">

                <button
                  type="button"
                  (click)="approve(request)"
                  class="mr-2 rounded-lg bg-green-50 p-2 text-green-600 hover:bg-green-100">

                  <i class="pi pi-check"></i>

                </button>

                <button
                  type="button"
                  (click)="reject(request)"
                  class="rounded-lg bg-red-50 p-2 text-red-500 hover:bg-red-100">

                  <i class="pi pi-times"></i>

                </button>

              </ng-container>

              <span
                *ngIf="request.status === 'Approved'"
                class="text-xs font-medium text-green-600">

                Approved

              </span>

              <span
                *ngIf="request.status === 'Rejected'"
                class="text-xs font-medium text-red-500">

                Rejected

              </span>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
