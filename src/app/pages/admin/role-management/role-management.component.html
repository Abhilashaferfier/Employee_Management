<div class="min-h-full bg-slate-50">

  <div class="mb-6 flex flex-col justify-between gap-3 sm:flex-row sm:items-center">

    <div>

      <h2 class="text-2xl font-bold text-slate-800">
        Role Management
      </h2>

      <p class="mt-1 text-sm text-slate-500">
        Manage system roles and permissions.
      </p>

    </div>

    <button
      type="button"
      (click)="addRole()"
      class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-blue-700">

      <i class="pi pi-plus mr-2"></i>

      Add Role

    </button>

  </div>


  <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">

    <div
      *ngFor="let role of roles"
      class="rounded-xl border border-blue-100 bg-white p-5 shadow-sm">

      <div class="flex items-start justify-between">

        <div
          class="flex h-11 w-11 items-center justify-center rounded-lg bg-blue-50">

          <i class="pi pi-shield text-blue-600"></i>

        </div>

        <span class="rounded-full bg-green-50 px-3 py-1 text-xs font-medium text-green-600">
          {{ role.status }}
        </span>

      </div>

      <h3 class="mt-4 text-lg font-semibold text-slate-800">
        {{ role.name }}
      </h3>

      <p class="mt-1 text-sm text-slate-500">
        {{ role.description }}
      </p>

      <p class="mt-4 text-sm text-slate-600">

        <i class="pi pi-users mr-2 text-blue-600"></i>

        {{ role.employees }} Employees

      </p>

      <button
        type="button"
        (click)="editRole(role)"
        class="mt-5 text-sm font-medium text-blue-600 hover:text-blue-700">

        <i class="pi pi-pencil mr-1"></i>

        Edit Role

      </button>

    </div>

  </div>

</div>
