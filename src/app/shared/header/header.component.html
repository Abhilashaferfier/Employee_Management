<header
  class="fixed top-0 left-0 right-0 z-50 flex h-16 shrink-0 items-center justify-between border-b border-slate-200 bg-white px-4 shadow-sm md:px-6"
>


  <!-- =============================================== -->
  <!-- LEFT SIDE -->
  <!-- =============================================== -->

  <div
    class="flex items-center gap-4"
  >


    <!-- HAMBURGER -->

    <button
  *ngIf="isPortalHeader"
  type="button"
  class="flex h-10 w-10 items-center justify-center text-slate-900 transition hover:bg-transparent focus:outline-none focus:ring-0 active:bg-transparent"
  (click)="toggleSidebar()"
>

  <i
    class="pi pi-bars text-xl font-bold"
  ></i>

</button>


    <!-- HRMS -->

    <h1
      *ngIf="!isPortalHeader"
      class="text-lg font-bold text-blue-600 md:text-xl"
    >

      HRMS

    </h1>


    <!-- PORTAL TITLE -->

    <h1
      *ngIf="isPortalHeader"
      class="text-lg font-bold text-blue-600 md:text-xl"
    >

      {{ role }} Dashboard

    </h1>


  </div>


  <!-- =============================================== -->
  <!-- RIGHT SIDE -->
  <!-- =============================================== -->

  <div
    class="flex items-center gap-3"
  >


    <!-- ============================================= -->
    <!-- PROFILE -->
    <!-- ============================================= -->

    <div
      *ngIf="isPortalHeader"
      class="relative"
    >


      <!-- AT BUTTON -->

      <button
        type="button"
        class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-600 text-sm font-bold text-white transition hover:bg-blue-700"
        (click)="toggleProfileMenu()"
      >

        {{ initials }}

      </button>


      <!-- =========================================== -->
      <!-- PROFILE DROPDOWN -->
      <!-- =========================================== -->

      <div
        *ngIf="profileMenuVisible"
        class="absolute right-0 top-12 z-[60] w-64 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-xl"
      >


        <!-- ========================================= -->
        <!-- USER INFORMATION -->
        <!-- NAME + EMAIL -->
        <!-- ========================================= -->

        <div
          class="border-b border-slate-100 px-4 py-4"
        >

          <p
            class="font-semibold text-slate-800"
          >

            {{ firstName }}
            {{ lastName }}

          </p>


          <p
            class="mt-1 break-all text-sm text-slate-500"
          >

            {{ email }}

          </p>

        </div>


        <!-- ========================================= -->
        <!-- SWITCH ROLE -->
        <!-- ========================================= -->

        <button
          *ngIf="hasMultipleRoles"
          type="button"
          class="flex w-full items-center gap-3 bg-blue-600 px-4 py-3 text-left text-sm font-semibold text-white transition hover:bg-blue-700"
          (click)="switchRole()"
        >

          <i
            class="pi pi-sync text-base"
          ></i>

          Switch Role

        </button>


      </div>


    </div>


    <!-- ============================================= -->
    <!-- LOGOUT ICON -->
    <!-- ============================================= -->

    <button
      type="button"
      [disabled]="logoutLoading"
      class="flex h-10 w-10 items-center justify-center rounded-full text-red-600 transition hover:bg-red-50 disabled:cursor-not-allowed disabled:opacity-50"
      (click)="logout()"
      title="Logout"
    >


      <!-- LOGOUT ICON -->

      <i
        *ngIf="!logoutLoading"
        class="pi pi-sign-out text-lg"
      ></i>


      <!-- LOADING -->

      <i
        *ngIf="logoutLoading"
        class="pi pi-spin pi-spinner text-lg"
      ></i>


    </button>


  </div>


</header>
