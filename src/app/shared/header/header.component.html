<header
  class="flex h-16 items-center justify-between border-b border-slate-200 bg-white px-4 shadow-sm md:px-6"
>

  <!-- ================================================= -->
  <!-- LEFT -->
  <!-- ================================================= -->

  <div class="flex items-center gap-4">

    <!-- HAMBURGER -->

    <button
      type="button"
      pButton
      class="p-button-text p-button-rounded !text-slate-600 hover:!bg-slate-100"
      (click)="toggleSidebar()"
      aria-label="Toggle sidebar"
    >

      <i class="pi pi-bars text-lg"></i>

    </button>


    <!-- DASHBOARD HEADING -->

    <h1
      class="text-lg font-semibold text-slate-800 md:text-xl"
    >

      {{ role }} Dashboard

    </h1>

  </div>


  <!-- ================================================= -->
  <!-- RIGHT PROFILE -->
  <!-- ================================================= -->

  <div class="relative">


    <!-- PROFILE BUTTON -->

    <button
      type="button"
      class="flex items-center gap-2 rounded-lg px-2 py-1.5 hover:bg-slate-100"
      (click)="toggleProfileMenu()"
    >

      <!-- INITIALS -->

      <div
        class="flex h-9 w-9 items-center justify-center rounded-full bg-blue-100 text-sm font-bold text-blue-700"
      >

        {{ initials }}

      </div>


      <!-- CHEVRON -->

      <i
        class="pi text-xs text-slate-500"
        [ngClass]="
          profileMenuVisible
            ? 'pi-chevron-up'
            : 'pi-chevron-down'
        "
      >
      </i>

    </button>


    <!-- ================================================= -->
    <!-- PROFILE DROPDOWN -->
    <!-- ================================================= -->

    <div
      *ngIf="profileMenuVisible"
      class="absolute right-0 top-12 z-50 w-64 rounded-xl border border-slate-200 bg-white p-2 shadow-xl"
    >


      <!-- USER INFO -->

      <div
        class="border-b border-slate-100 px-3 py-3"
      >

        <p
          class="font-semibold text-slate-800"
        >

          {{ firstName }}
          {{ lastName }}

        </p>


        <p
          class="mt-1 text-sm text-slate-500 break-all"
        >

          {{ email }}

        </p>

      </div>


      <!-- ================================================= -->
      <!-- CURRENT ROLE -->
      <!-- ================================================= -->

      <div
        class="border-b border-slate-100 px-3 py-3"
      >

        <p
          class="text-xs text-slate-400"
        >

          Current Portal

        </p>


        <p
          class="mt-1 text-sm font-semibold text-slate-700"
        >

          {{ role }}

        </p>

      </div>


      <!-- ================================================= -->
      <!-- SWITCH ROLE -->
      <!-- Only if Admin + Employee -->
      <!-- ================================================= -->

      <button
        *ngIf="hasBothRoles"
        type="button"
        class="mt-1 flex w-full items-center gap-2 rounded-md px-3 py-2 text-left text-sm text-slate-700 hover:bg-slate-100"
        (click)="switchRole()"
      >

        <i class="pi pi-sync"></i>

        <span>
          Switch Role
        </span>

      </button>


      <!-- ================================================= -->
      <!-- LOGOUT -->
      <!-- ================================================= -->

      <button
        type="button"
        class="mt-1 flex w-full items-center gap-2 rounded-md px-3 py-2 text-left text-sm text-red-600 hover:bg-red-50"
        (click)="logout()"
        [disabled]="logoutLoading"
      >

        <i class="pi pi-sign-out"></i>

        <span>

          {{
            logoutLoading
              ? 'Logging out...'
              : 'Logout'
          }}

        </span>

      </button>

    </div>

  </div>

</header>
