<header
  class="fixed top-0 left-0 right-0 z-50 flex h-16 shrink-0 items-center justify-between border-b border-slate-200 bg-white px-4 shadow-sm md:px-6"
>

  <!-- =============================================== -->
  <!-- LEFT SIDE -->
  <!-- =============================================== -->

  <div class="flex items-center gap-4">


    <!-- HAMBURGER -->

    <button
      *ngIf="isPortalHeader"
      type="button"
      pButton
      class="p-button-text p-button-rounded !text-slate-600 hover:!bg-slate-100"
      (click)="toggleSidebar()"
    >

      <i class="pi pi-bars text-lg"></i>

    </button>


    <!-- HRMS -->

    <h1
      *ngIf="!isPortalHeader"
      class="text-lg font-bold text-slate-800 md:text-xl"
    >

      HRMS

    </h1>


    <!-- PORTAL TITLE -->

    <h1
      *ngIf="isPortalHeader"
      class="text-lg font-semibold text-slate-800 md:text-xl"
    >

      {{ role }} Dashboard

    </h1>


  </div>


  <!-- =============================================== -->
  <!-- RIGHT SIDE -->
  <!-- =============================================== -->

  <div class="relative">


    <!-- PROFILE BUTTON -->

    <button
      *ngIf="isPortalHeader"
      type="button"
      class="flex items-center gap-2 rounded-lg px-2 py-1.5 transition hover:bg-slate-100"
      (click)="toggleProfileMenu()"
    >

      <!-- INITIAL -->

      <div
        class="flex h-9 w-9 items-center justify-center rounded-full bg-blue-100 text-sm font-bold text-blue-700"
      >

        {{ initials }}

      </div>


      <!-- ARROW -->

      <i
        class="pi text-xs text-slate-500"
        [ngClass]="
          profileMenuVisible
            ? 'pi-chevron-up'
            : 'pi-chevron-down'
        "
      >
      </i>

    </button>


    <!-- ============================================= -->
    <!-- LOGOUT FOR PUBLIC HEADER -->
    <!-- ============================================= -->

    <button
      *ngIf="!isPortalHeader"
      type="button"
      class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-red-600"
      (click)="logout()"
    >

      <i class="pi pi-sign-out"></i>

      Logout

    </button>


    <!-- ============================================= -->
    <!-- PROFILE DROPDOWN -->
    <!-- ============================================= -->

    <div
      *ngIf="
        isPortalHeader &&
        profileMenuVisible
      "
      class="absolute right-0 top-12 z-[60] w-64 rounded-xl border border-slate-200 bg-white p-2 shadow-xl"
    >


      <!-- USER INFORMATION -->

      <div
        class="border-b border-slate-100 px-3 py-3"
      >

        <p
          class="font-semibold text-slate-800"
        >

          {{ firstName }}
          {{ lastName }}

        </p>


        <p
          class="mt-1 text-sm text-slate-500"
        >

          {{ email }}

        </p>

      </div>


      <!-- CURRENT PORTAL -->

      <div
        class="border-b border-slate-100 px-3 py-3"
      >

        <p
          class="text-xs text-slate-400"
        >

          Current Portal

        </p>


        <p
          class="mt-1 text-sm font-semibold text-slate-700"
        >

          {{ role }}

        </p>

      </div>


      <!-- SWITCH ROLE -->

      <button
        *ngIf="hasMultipleRoles"
        type="button"
        class="mt-1 flex w-full items-center gap-2 rounded-md px-3 py-2 text-left text-sm text-slate-700 hover:bg-slate-100"
        (click)="switchRole()"
      >

        <i class="pi pi-sync"></i>

        Switch Role

      </button>


      <!-- LOGOUT -->

      <button
        type="button"
        class="mt-1 flex w-full items-center gap-2 rounded-md px-3 py-2 text-left text-sm text-red-600 hover:bg-red-50"
        (click)="logout()"
      >

        <i class="pi pi-sign-out"></i>

        Logout

      </button>


    </div>


  </div>


</header>
