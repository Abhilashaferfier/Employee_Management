<aside
  class="flex h-full w-64 shrink-0 flex-col overflow-hidden border-r border-slate-200 bg-white"
>


  <!-- =============================================== -->
  <!-- NAVIGATION -->
  <!-- =============================================== -->

  <nav
    class="flex-1 overflow-y-auto p-3"
  >


    <!-- ============================================ -->
    <!-- DASHBOARD -->
    <!-- ============================================ -->

    <a
      routerLink="/employee/dashboard"
      routerLinkActive="!bg-blue-600 !text-white shadow-sm"
      [routerLinkActiveOptions]="{ exact: true }"
      class="mb-1 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-slate-800 transition hover:bg-slate-100 hover:text-slate-950"
    >

      <i
        class="pi pi-home text-base"
      ></i>

      <span>
        Dashboard
      </span>

    </a>


    <!-- ============================================ -->
    <!-- PROFILE -->
    <!-- ============================================ -->

    <a
      routerLink="/employee/profile"
      routerLinkActive="!bg-blue-600 !text-white shadow-sm"
      class="mb-1 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-slate-800 transition hover:bg-slate-100 hover:text-slate-950"
    >

      <i
        class="pi pi-user text-base"
      ></i>

      <span>
        Profile
      </span>

    </a>


    <!-- ============================================ -->
    <!-- ATTENDANCE -->
    <!-- ============================================ -->

    <a
      routerLink="/employee/attendance"
      routerLinkActive="!bg-blue-600 !text-white shadow-sm"
      class="mb-1 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-slate-800 transition hover:bg-slate-100 hover:text-slate-950"
    >

      <i
        class="pi pi-calendar text-base"
      ></i>

      <span>
        Attendance
      </span>

    </a>


    <!-- ============================================ -->
    <!-- LEAVE REQUESTS -->
    <!-- ============================================ -->

    <a
      routerLink="/employee/leave-requests"
      routerLinkActive="!bg-blue-600 !text-white shadow-sm"
      class="mb-1 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-slate-800 transition hover:bg-slate-100 hover:text-slate-950"
    >

      <i
        class="pi pi-calendar-plus text-base"
      ></i>

      <span>
        Leave Requests
      </span>

    </a>


    <!-- ============================================ -->
    <!-- PAYSLIPS -->
    <!-- ============================================ -->

    <a
      routerLink="/employee/payslips"
      routerLinkActive="!bg-blue-600 !text-white shadow-sm"
      class="mb-1 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-slate-800 transition hover:bg-slate-100 hover:text-slate-950"
    >

      <i
        class="pi pi-file text-base"
      ></i>

      <span>
        Payslips
      </span>

    </a>


    <!-- ============================================ -->
    <!-- REPORTS -->
    <!-- ============================================ -->

    <a
      routerLink="/employee/reports"
      routerLinkActive="!bg-blue-600 !text-white shadow-sm"
      class="mb-1 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-slate-800 transition hover:bg-slate-100 hover:text-slate-950"
    >

      <i
        class="pi pi-chart-bar text-base"
      ></i>

      <span>
        Reports
      </span>

    </a>


    <!-- ============================================ -->
    <!-- LEAVE APPROVAL -->
    <!-- ============================================ -->

    <a
      routerLink="/employee/leave-approval"
      routerLinkActive="!bg-blue-600 !text-white shadow-sm"
      class="mb-1 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-slate-800 transition hover:bg-slate-100 hover:text-slate-950"
    >

      <i
        class="pi pi-file text-base"
      ></i>

      <span>
        Leave Approval
      </span>

    </a>


  </nav>


</aside>
