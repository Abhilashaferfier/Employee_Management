<aside
  class="flex h-[calc(100vh-4rem)] w-64 shrink-0 flex-col overflow-hidden border-r border-slate-200 bg-white"
>


  <!-- ============================================== -->
  <!-- MENU -->
  <!-- ============================================== -->

  <nav
    class="flex-1 space-y-2 overflow-y-auto p-3"
  >


    <!-- ============================================ -->
    <!-- DASHBOARD -->
    <!-- ============================================ -->

    <a
      routerLink="/viewer/dashboard"
      routerLinkActive="!bg-blue-600 !text-white"
      [routerLinkActiveOptions]="{ exact: true }"
      class="mb-1 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-slate-800 transition hover:bg-slate-100 hover:text-slate-950"
    >

      <i
        class="pi pi-home"
      ></i>

      <span>
        Dashboard
      </span>

    </a>


    <!-- ============================================ -->
    <!-- EMPLOYEE MANAGEMENT -->
    <!-- ============================================ -->

    <a
      routerLink="/viewer/employees"
      routerLinkActive="!bg-blue-600 !text-white"
      class="mb-1 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-slate-800 transition hover:bg-slate-100 hover:text-slate-950"
    >

      <i
        class="pi pi-users"
      ></i>

      <span>
        Employee Management
      </span>

    </a>


    <!-- ============================================ -->
    <!-- LEAVE APPROVAL -->
    <!-- ============================================ -->

    <a
      routerLink="/viewer/leave-approval"
      routerLinkActive="!bg-blue-600 !text-white"
      class="mb-1 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-slate-800 transition hover:bg-slate-100 hover:text-slate-950"
    >

      <i
        class="pi pi-calendar"
      ></i>

      <span>
        Leave Approval
      </span>

    </a>


    <!-- ============================================ -->
    <!-- ATTENDANCE MANAGEMENT -->
    <!-- ============================================ -->

    <a
      routerLink="/viewer/attendance"
      routerLinkActive="!bg-blue-600 !text-white"
      class="mb-1 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-slate-800 transition hover:bg-slate-100 hover:text-slate-950"
    >

      <i
        class="pi pi-clock"
      ></i>

      <span>
        Attendance Management
      </span>

    </a>


    <!-- ============================================ -->
    <!-- PAYROLL -->
    <!-- ============================================ -->

    <a
      routerLink="/viewer/payroll"
      routerLinkActive="!bg-blue-600 !text-white"
      class="mb-1 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-slate-800 transition hover:bg-slate-100 hover:text-slate-950"
    >

      <i
        class="pi pi-money-bill"
      ></i>

      <span>
        Payroll
      </span>

    </a>


    <!-- ============================================ -->
    <!-- REPORTS -->
    <!-- ============================================ -->

    <a
      routerLink="/viewer/reports"
      routerLinkActive="!bg-blue-600 !text-white"
      class="mb-1 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-slate-800 transition hover:bg-slate-100 hover:text-slate-950"
    >

      <i
        class="pi pi-chart-bar"
      ></i>

      <span>
        Reports
      </span>

    </a>


    <!-- ============================================ -->
    <!-- ROLE MANAGEMENT -->
    <!-- ============================================ -->

    <a
      routerLink="/viewer/roles"
      routerLinkActive="!bg-blue-600 !text-white"
      class="mb-1 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-slate-800 transition hover:bg-slate-100 hover:text-slate-950"
    >

      <i
        class="pi pi-shield"
      ></i>

      <span>
        Role Management
      </span>

    </a>


    <!-- ============================================ -->
    <!-- USERS -->
    <!-- ============================================ -->

    <a
      routerLink="/viewer/users"
      routerLinkActive="!bg-blue-600 !text-white"
      class="mb-1 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-slate-800 transition hover:bg-slate-100 hover:text-slate-950"
    >

      <i
        class="pi pi-users"
      ></i>

      <span>
        Users
      </span>

    </a>


  </nav>


</aside>
