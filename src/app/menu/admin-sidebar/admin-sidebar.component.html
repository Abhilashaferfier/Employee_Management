<aside
  class="flex h-full w-64 shrink-0 flex-col overflow-hidden border-r border-slate-200 bg-white"
>


  <!-- =============================================== -->
  <!-- MENU -->
  <!-- =============================================== -->

  <nav
    class="flex-1 overflow-y-auto px-3 py-4"
  >


    <!-- ============================================= -->
    <!-- DASHBOARD -->
    <!-- ============================================= -->

    <a
      routerLink="/admin/dashboard"
      routerLinkActive="!bg-blue-600 !text-white shadow-sm"
      [routerLinkActiveOptions]="{ exact: true }"
      class="mb-2 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-bold text-slate-900 transition-all duration-200 hover:bg-blue-50 hover:text-blue-700"
    >

      <i
        class="pi pi-home text-base"
      ></i>

      <span>
        Dashboard
      </span>

    </a>


    <!-- ============================================= -->
    <!-- EMPLOYEE MANAGEMENT -->
    <!-- ============================================= -->

    <a
      routerLink="/admin/employees"
      routerLinkActive="!bg-blue-600 !text-white shadow-sm"
      class="mb-2 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-bold text-slate-900 transition-all duration-200 hover:bg-blue-50 hover:text-blue-700"
    >

      <i
        class="pi pi-users text-base"
      ></i>

      <span>
        Employee Management
      </span>

    </a>


    <!-- ============================================= -->
    <!-- LEAVE APPROVAL -->
    <!-- ============================================= -->

    <a
      routerLink="/admin/leave-approval"
      routerLinkActive="!bg-blue-600 !text-white shadow-sm"
      class="mb-2 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-bold text-slate-900 transition-all duration-200 hover:bg-blue-50 hover:text-blue-700"
    >

      <i
        class="pi pi-calendar text-base"
      ></i>

      <span>
        Leave Approval
      </span>

    </a>


    <!-- ============================================= -->
    <!-- ATTENDANCE MANAGEMENT -->
    <!-- ============================================= -->

    <a
      routerLink="/admin/attendance"
      routerLinkActive="!bg-blue-600 !text-white shadow-sm"
      class="mb-2 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-bold text-slate-900 transition-all duration-200 hover:bg-blue-50 hover:text-blue-700"
    >

      <i
        class="pi pi-clock text-base"
      ></i>

      <span>
        Attendance Management
      </span>

    </a>


    <!-- ============================================= -->
    <!-- PAYROLL MANAGEMENT -->
    <!-- ============================================= -->

    <a
      routerLink="/admin/payroll"
      routerLinkActive="!bg-blue-600 !text-white shadow-sm"
      class="mb-2 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-bold text-slate-900 transition-all duration-200 hover:bg-blue-50 hover:text-blue-700"
    >

      <i
        class="pi pi-money-bill text-base"
      ></i>

      <span>
        Payroll Management
      </span>

    </a>


    <!-- ============================================= -->
    <!-- REPORTS -->
    <!-- ============================================= -->

    <a
      routerLink="/admin/reports"
      routerLinkActive="!bg-blue-600 !text-white shadow-sm"
      class="mb-2 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-bold text-slate-900 transition-all duration-200 hover:bg-blue-50 hover:text-blue-700"
    >

      <i
        class="pi pi-chart-bar text-base"
      ></i>

      <span>
        Reports
      </span>

    </a>


    <!-- ============================================= -->
    <!-- ROLE MANAGEMENT -->
    <!-- ============================================= -->

    <a
      routerLink="/admin/roles"
      routerLinkActive="!bg-blue-600 !text-white shadow-sm"
      class="mb-2 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-bold text-slate-900 transition-all duration-200 hover:bg-blue-50 hover:text-blue-700"
    >

      <i
        class="pi pi-shield text-base"
      ></i>

      <span>
        Role Management
      </span>

    </a>


    <!-- ============================================= -->
    <!-- USERS -->
    <!-- ============================================= -->

    <a
      routerLink="/admin/users"
      routerLinkActive="!bg-blue-600 !text-white shadow-sm"
      class="mb-2 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-bold text-slate-900 transition-all duration-200 hover:bg-blue-50 hover:text-blue-700"
    >

      <i
        class="pi pi-users text-base"
      ></i>

      <span>
        Users
      </span>

    </a>


  </nav>


</aside>
